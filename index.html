<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarSpark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: a sunrise on the horizon. Home = giant wordmark over a rising sun, search bar sits on the horizon line.
   Results = sticky glass top bar, one bold 680px column. Single dark look by choice. */
:root{
  --sky:#0a0613; --sky2:#1a0b2e; --glass:rgba(26,14,44,.72); --line:rgba(255,190,120,.18); --line2:rgba(255,255,255,.08);
  --text:#fff6ec; --muted:#bfaecf; --sun:#ffc23d; --flare:#ff8a1f; --ember:#ff3d5e; --gold:#ffd88a; --visited:#e7a6ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --fire:linear-gradient(100deg,var(--sun) 0%,var(--flare) 45%,var(--ember) 100%);
  --h1:#ff5a2a; --h2:#b0234f; --h3:#4a1258; --h4:#2a0f3d; --s1:rgba(255,214,120,.95); --s2:rgba(255,138,31,.75); --s3:rgba(255,61,94,.25); --ink:#2a0710;
  color-scheme:dark;
}
body[data-pal="ocean"]{--sun:#7ff3ff;--flare:#2fa8ff;--ember:#7b5cff;--gold:#a6ecff;--visited:#c7b8ff;--h1:#2fa8ff;--h2:#1d4fb8;--h3:#24165e;--h4:#0f1e45;--s1:rgba(170,245,255,.95);--s2:rgba(47,168,255,.7);--s3:rgba(123,92,255,.25);--line:rgba(127,243,255,.2);--ink:#06142e}
body[data-pal="aurora"]{--sun:#b8ff6a;--flare:#2fe0b0;--ember:#9b5cff;--gold:#c9ffa6;--visited:#d6b8ff;--h1:#2fe0b0;--h2:#127a74;--h3:#2a1660;--h4:#0f2a33;--s1:rgba(210,255,170,.9);--s2:rgba(47,224,176,.65);--s3:rgba(155,92,255,.25);--line:rgba(184,255,106,.2);--ink:#08201a}
body[data-pal="candy"]{--sun:#ffd1f2;--flare:#ff5fc8;--ember:#9a4dff;--gold:#ffc2ea;--visited:#d8b8ff;--h1:#ff5fc8;--h2:#a3248f;--h3:#3d1470;--h4:#2c0f3d;--s1:rgba(255,215,245,.95);--s2:rgba(255,95,200,.7);--s3:rgba(154,77,255,.25);--line:rgba(255,95,200,.2);--ink:#2a0722}
body{--fire:linear-gradient(100deg,var(--sun) 0%,var(--flare) 45%,var(--ember) 100%)}
body.nosun:not(.searching){background:radial-gradient(90% 60% at 50% 100%,var(--h4) 0%,var(--sky) 70%) fixed}
body.nosun .sunwrap::before{display:none}
body.nostars #sky{display:none}
*{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 108%,var(--h1) 0%,var(--h2) 18%,var(--h3) 38%,var(--sky2) 58%,var(--sky) 80%) fixed;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
body.searching{background:radial-gradient(90% 40% at 50% 0%,var(--h4) 0%,var(--sky) 70%) fixed}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#homeview,#resultsview{position:relative;z-index:1}

/* wordmark */
.logo{font-family:var(--display);font-weight:900;letter-spacing:-.045em;line-height:.86;background:none;border:0;padding:0;cursor:pointer;color:var(--text);text-transform:uppercase;display:inline-flex;flex-direction:column;align-items:center}
.logo span{background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;filter:drop-shadow(0 6px 30px rgba(255,120,40,.45))}

/* home */
#homeview{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-block:40px 120px;text-align:center}
#homeview .logo{font-size:clamp(56px,15vw,150px)}
.kicker{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:-6px 0 0;padding-left:.42em}
.sunwrap{position:relative;width:100%;max-width:660px}
.sunwrap::before{content:"";position:absolute;left:50%;top:50%;width:min(520px,120%);aspect-ratio:1;transform:translate(-50%,-14%);border-radius:50%;background:radial-gradient(circle,var(--s1) 0%,var(--s2) 34%,var(--s3) 56%,transparent 70%);filter:blur(4px);z-index:-1;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translate(-50%,30%);opacity:0}to{transform:translate(-50%,-14%);opacity:1}}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:14px 24px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.hot{background:var(--fire);color:var(--ink);border:0;box-shadow:0 10px 30px -8px rgba(255,90,40,.7)}
.btn.cool{background:rgba(10,6,19,.45);color:var(--text);border:2px solid rgba(255,246,236,.55);backdrop-filter:blur(6px)}
.btn.cool:hover{border-color:var(--sun);color:var(--sun)}
.picks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:600px}
.pick{font:700 13px var(--body);color:var(--text);background:rgba(10,6,19,.4);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.pick:hover{border-color:var(--sun);color:var(--sun)}

/* search box */
.sbox{position:relative;width:100%}
.sbox form{position:relative;display:flex;align-items:center;gap:12px;height:64px;padding:0 8px 0 22px;border-radius:999px;background:linear-gradient(var(--sky),var(--sky)) padding-box,var(--fire) border-box;border:3px solid transparent;box-shadow:0 18px 60px -20px rgba(255,100,40,.8)}
.sbox form:focus-within{box-shadow:0 0 0 6px rgba(255,170,60,.18),0 18px 70px -14px rgba(255,100,40,.95)}
.sbox.open form{border-radius:32px 32px 0 0}
.sbox svg{flex:none;color:var(--sun)}
.sbox input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:var(--text);font:600 18px var(--body)}
.sbox input::placeholder{color:var(--muted);font-weight:500}
.sbox input::-webkit-search-cancel-button{display:none}
.clr{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;padding:0 4px;line-height:1}
.sbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--fire);color:var(--ink);font:900 22px var(--display);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.sbtn:hover{transform:rotate(-12deg) scale(1.06)}
.sugg{position:absolute;left:0;right:0;top:64px;margin:0;padding:6px 0 14px;list-style:none;background:#140a24;border:3px solid var(--flare);border-top:1px solid var(--line);border-radius:0 0 32px 32px;z-index:5;text-align:left}
.sugg li{display:flex;align-items:center;gap:14px;padding:9px 22px;cursor:pointer;font-weight:600}
.sugg li svg{width:16px;height:16px;color:var(--muted)}
.sugg li.on,.sugg li:hover{background:rgba(255,138,31,.14)}
.sugg li small{margin-left:auto;color:var(--muted);font-weight:500}

/* results */
#top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:16px max(16px,env(safe-area-inset-left,0px));background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{font-size:22px;flex-direction:row;gap:.25em;line-height:1}
#top .sbox{flex:1;min-width:240px;max-width:680px}
#top .sbox form{height:52px;border-width:2px}
#top .sbtn{width:38px;height:38px;font-size:18px}
#top .sugg{top:52px}
.tabs{display:flex;gap:10px;margin:22px 0 6px;max-width:680px}
.tabs span{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px;color:var(--muted);border:1px solid var(--line2)}
.tabs span.on{background:var(--fire);color:var(--ink);border-color:transparent}
#results{max-width:680px;padding-top:8px}
.stats{color:var(--muted);font-size:13px;margin-bottom:18px;font-variant-numeric:tabular-nums}
.overview{position:relative;padding:20px 22px;margin-bottom:28px;border-radius:24px;background:linear-gradient(#170c28,#170c28) padding-box,var(--fire) border-box;border:2px solid transparent}
.overview h3{margin:0 0 10px;font:800 13px var(--display);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--gold)}
.overview h3 i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff3c4 0%,var(--sun) 40%,var(--ember) 100%);box-shadow:0 0 18px var(--flare)}
.overview p{margin:0 0 8px;white-space:pre-wrap;font-size:16px}
.overview .note{font-size:12px;color:var(--muted)}
.thinking{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.answer{margin-bottom:28px;padding:22px 24px;border-radius:24px;background:var(--fire);color:var(--ink);font:900 clamp(30px,8vw,48px)/1.05 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.answer small{display:block;font:700 14px var(--body);letter-spacing:0;margin-bottom:6px;opacity:.75}
.res{position:relative;margin-bottom:10px;padding:16px 18px;border-radius:20px;min-width:0;transition:background .15s}
.res:hover{background:rgba(255,138,31,.08)}
.src{display:flex;align-items:center;gap:12px;font-size:13px;min-width:0}
.fav{flex:none;width:30px;height:30px;border-radius:10px;background:var(--fire);display:grid;place-items:center;font:900 13px var(--display);color:var(--ink);transform:rotate(-6deg)}
.src div{min-width:0}
.src b{display:block;font-weight:700;color:var(--text)}
.src cite{display:block;font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res a.t{display:inline-block;margin:8px 0 4px;color:var(--gold);font:800 21px/1.25 var(--body);letter-spacing:-.01em;text-decoration:none}
.res a.t::after{content:"";position:absolute;inset:0;border-radius:20px}
.res a.t:visited{color:var(--visited)}
.res:hover a.t{text-decoration:underline;text-decoration-color:var(--flare);text-decoration-thickness:2px;text-underline-offset:4px}
.res p{margin:0;color:var(--muted);font-size:14.5px}
.res p em{font-style:normal;font-weight:800;color:var(--text)}
.tag{font:800 10px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:8px;color:var(--ink);background:var(--gold)}
.none{font:800 20px var(--display);color:var(--text);padding:30px 0}
.none b{background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}
.gear{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,6,19,.45);color:var(--text);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .2s,border-color .2s}
.gear:hover{border-color:var(--sun);color:var(--sun);transform:rotate(45deg)}
#hgear{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:3}
#top .gear{margin-left:auto}
.keyhint{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13px}
.keyhint kbd{font:800 12px var(--display);color:var(--ink);background:var(--fire);border-radius:7px;padding:3px 8px;margin-right:4px}
.keyhint span{background:rgba(10,6,19,.4);border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 6px}
#settings{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,2,10,.7);backdrop-filter:blur(8px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;background:#120a20;border-radius:28px;padding:26px 24px;background:linear-gradient(#120a20,#120a20) padding-box,var(--fire) border-box;border:2px solid transparent;text-align:left}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.panel h2{margin:0;font:900 26px var(--display);letter-spacing:-.03em;text-transform:uppercase}
.panel h3{margin:26px 0 6px;font:800 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.panel p.help{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--text);font-size:22px;cursor:pointer}
.x:hover{border-color:var(--sun)}
.krow{display:grid;grid-template-columns:52px 1fr 1.4fr 34px;gap:8px;margin-bottom:8px}
.krow input,.panel input.txt{min-width:0;height:40px;border-radius:12px;border:1px solid var(--line2);background:#0a0613;color:var(--text);font:600 14px var(--body);padding:0 12px}
.krow input:focus,.panel input.txt:focus{outline:none;border-color:var(--sun)}
.krow input.k{text-align:center;font:900 16px var(--display);text-transform:uppercase;color:var(--sun);padding:0}
.krow .rm{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:10px}
.krow .rm:hover{color:var(--ember);background:rgba(255,61,94,.1)}
.addk{margin-top:4px;border:1px dashed var(--line);background:none;color:var(--gold);border-radius:12px;height:40px;width:100%;font:700 14px var(--body);cursor:pointer}
.addk:hover{border-color:var(--sun)}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal{border:2px solid var(--line2);border-radius:16px;background:#0a0613;color:var(--text);padding:10px 6px 8px;cursor:pointer;font:700 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:8px}
.pal i{width:100%;height:30px;border-radius:10px;display:block}
.pal[aria-pressed="true"]{border-color:var(--sun)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.tog span{display:flex;flex-direction:column}
.tog small{color:var(--muted);font-size:12.5px}
.tog input{appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:#2a2238;position:relative;cursor:pointer;transition:background .2s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked{background:var(--fire)}
.tog input:checked::after{transform:translateX(20px)}
.panel footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.reset{border:0;background:none;color:var(--muted);font:600 13px var(--body);cursor:pointer;text-decoration:underline}
.saved{color:var(--gold);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:11;background:var(--fire);color:var(--ink);font:800 14px var(--body);padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
@media (max-width:520px){#top{gap:12px}.sbox form{height:56px}.sugg{top:56px}}
@media (prefers-reduced-motion:reduce){.sunwrap::before,.thinking{animation:none}.btn,.sbtn{transition:none}}
</style></head><body>
<canvas id="sky" aria-hidden="true"></canvas>

<div id="homeview">
  <button class="logo" type="button" aria-label="SolarSpark">Solar<span>Spark</span></button>
  <p class="kicker">Search at the speed of light</p>
  <div class="sunwrap"><div class="sbox" id="hbox"></div></div>
  <div class="btns">
    <button class="btn hot" type="button" id="hsearch">Spark Search</button>
    <button class="btn cool" type="button" id="lucky">Feeling Lucky</button>
  </div>
  <div class="keyhint" id="keyhint" hidden></div>
  <button class="gear" id="hgear" type="button" aria-label="Settings" title="Settings"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
</div>

<div id="resultsview" hidden>
  <div id="top"><button class="logo" type="button" id="home" aria-label="SolarSpark home">Solar<span>Spark</span></button><div class="sbox" id="tbox"></div><button class="gear" id="tgear" type="button" aria-label="Settings" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button></div>
  <nav class="tabs" aria-label="Result type"><span class="on">All</span></nav>
  <section id="results" aria-live="polite"></section>
</div>

<div id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settitle">
  <div class="panel">
    <header><h2 id="settitle">Settings</h2><button class="x" id="setclose" type="button" aria-label="Close settings">×</button></header>
    <h3>Quick keys</h3>
    <p class="help">Press a key anywhere on SolarSpark to jump straight to a site. While you're typing in the search bar, hold Alt and press the key.</p>
    <div id="krows"></div>
    <button class="addk" id="addk" type="button">+ Add a quick key</button>
    <h3>Colors</h3>
    <div class="pals" id="pals"></div>
    <h3>Options</h3>
    <label class="tog"><span>Quick keys on<small>Turn all quick keys on or off</small></span><input type="checkbox" id="o_keys"></label>
    <label class="tog"><span>Show my quick keys<small>List your keys under the search bar</small></span><input type="checkbox" id="o_hint"></label>
    <label class="tog"><span>Open sites in a new tab<small>Off: sites open in the tab you're in</small></span><input type="checkbox" id="o_newtab"></label>
    <label class="tog"><span>Twinkling stars</span><input type="checkbox" id="o_stars"></label>
    <label class="tog"><span>Rising sun glow</span><input type="checkbox" id="o_sun"></label>
    <footer><button class="reset" id="reset" type="button">Reset to defaults</button><span class="saved">Changes save automatically</span></footer>
  </div>
</div>

<script>
const INDEX = [
["Wikipedia","https://www.wikipedia.org","Learn","encyclopedia wiki facts history science people places","The free encyclopedia with millions of articles on almost every subject, written by volunteers."],
["Khan Academy","https://www.khanacademy.org","Learn","math lessons school homework algebra calculus science free courses","Free lessons and practice in math, science, history and test prep."],
["Wolfram Alpha","https://www.wolframalpha.com","Learn","math calculator compute equations science data","A computational knowledge engine that solves equations and answers data questions."],
["Merriam-Webster","https://www.merriam-webster.com","Learn","dictionary define definition word meaning spelling thesaurus","Dictionary definitions, pronunciation and word of the day."],
["Duolingo","https://www.duolingo.com","Learn","language learn spanish french japanese german lessons","Bite-size lessons to learn a new language for free."],
["Coursera","https://www.coursera.org","Learn","courses online university certificate degree","Online courses and certificates from universities and companies."],
["NASA","https://www.nasa.gov","Learn","space sun solar planets moon mars rockets astronomy","News, images and missions from NASA's exploration of space and the solar system."],
["Space Weather Prediction Center","https://www.swpc.noaa.gov","Learn","sun solar flare aurora storm space weather","Forecasts of solar flares, geomagnetic storms and aurora activity."],
["Project Gutenberg","https://www.gutenberg.org","Learn","books free ebooks read classic literature","Over 70,000 free ebooks of classic literature."],
["Library of Congress","https://www.loc.gov","Learn","history archive books maps photos research","Digital collections, historic newspapers and research guides."],
["Reuters","https://www.reuters.com","News","news world business breaking headlines","International breaking news covering business, markets and world events."],
["AP News","https://apnews.com","News","news headlines breaking us world politics","Breaking news from the Associated Press."],
["BBC News","https://www.bbc.com/news","News","news world uk headlines","World news, analysis and video from the BBC."],
["NPR","https://www.npr.org","News","news radio podcasts politics culture","News, stories and podcasts from National Public Radio."],
["ESPN","https://www.espn.com","News","sports scores nfl nba mlb football basketball baseball","Live scores, highlights and news across every major sport."],
["The Verge","https://www.theverge.com","News","tech technology gadgets reviews phones","Technology news, product reviews and culture."],
["Hacker News","https://news.ycombinator.com","News","tech startups programming links discussion","Links and discussion on computing and startups."],

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STOP=["the","a","an","of","for","to","in","and","is","how","what","why","do","does","i","my"];
const tok=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!STOP.includes(w));
const SITES=INDEX.map(([title,url,cat,kw,desc])=>({title,url,cat,desc,words:tok(title+" "+url.replace(/https?:\/\/(www\.)?/,"")+" "+kw+" "+desc),name:tok(title)}));
const bare=u=>u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return bare(u)}};
const crumb=u=>{try{const x=new URL(u);return x.origin.replace(/^https?:\/\/(www\.)?/,"https://")+(x.pathname.length>1?" › "+x.pathname.split("/").filter(Boolean).join(" › "):"")}catch(e){return u}};

// ---------- local index ----------
function local(q){
  const ws=tok(q);if(!ws.length)return[];
  return SITES.map(s=>{let sc=0,m=0;for(const w of ws){const n=s.words.filter(t=>t===w||(w.length>2&&t.startsWith(w))).length+(s.name.includes(w)?5:0);if(n)m++;sc+=n}return{s,sc:sc*m/ws.length}})
    .filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,6).map(r=>r.s);
}
function address(q){
  if(/^https?:\/\/\S+$/i.test(q))return q;
  if(/^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(q))return "https://"+q;
  return null;
}
function siteByName(q){const l=q.toLowerCase().replace(/[^a-z0-9]/g,"");return SITES.find(s=>s.title.toLowerCase().replace(/[^a-z0-9]/g,"")===l||host(s.url).split(".")[0]===l)}
function calc(q){
  const s=q.replace(/\s+/g,"").replace(/[x×]/g,"*").replace(/÷/g,"/").replace(/=$/,"");
  if(!/^[\d.+\-*/()^]+$/.test(s)||!/\d[+\-*/^]/.test(s))return null;
  let i=0;const p=()=>s[i];
  const atom=()=>{if(p()==="-"){i++;return-atom()}if(p()==="("){i++;const v=add();if(p()!==")")throw 0;i++;return v}const st=i;while(/[\d.]/.test(p()||""))i++;const n=parseFloat(s.slice(st,i));if(isNaN(n))throw 0;return n};
  const pow=()=>{const b=atom();if(p()==="^"){i++;return Math.pow(b,pow())}return b};
  const mul=()=>{let v=pow();while(p()==="*"||p()==="/"){const o=s[i++],r=pow();v=o==="*"?v*r:v/r}return v};
  const add=()=>{let v=mul();while(p()==="+"||p()==="-"){const o=s[i++],r=mul();v=o==="+"?v+r:v-r}return v};
  try{const v=add();return i===s.length&&isFinite(v)?+v.toPrecision(12):null}catch(e){return null}
}
const bold=(text,q)=>{let out=esc(text);for(const w of tok(q).filter(w=>w.length>2))out=out.replace(new RegExp("\\b("+w.replace(/[^a-z0-9]/g,"")+"\\w*)","gi"),"<em>$1</em>");return out};

let samplePromise=null,ctl=null;
const getSample=()=>samplePromise||(samplePromise=(window.claude?.use?window.claude.use("sample"):Promise.resolve(null)).catch(()=>null));
async function askSpark(q){
  const sample=await getSample();if(!sample)return {off:true};
  ctl?.abort();ctl=new AbortController();
  const prompt=`You are the engine behind SolarSpark, a web search page. The user searched for:
"${q}"

Reply with only a JSON object in this shape:
{"overview":"2-4 sentence direct answer or summary for the search, plain text, no markdown","results":[{"title":"page title","url":"https://...","snippet":"one or two sentences describing what that page offers for this search"}]}

Give 6 to 8 results. Use only real, long-established websites and pages you are confident exist (official sites, Wikipedia articles, major references, well-known services). Prefer homepages or stable article URLs over deep links you are unsure of. If the search is about something current (news, scores, prices, weather), say in the overview that it may have changed and point to sources that track it live.`;
  try{return await sample.json(prompt,{modelTier:"quick",signal:ctl.signal,cache:{gcTime:3600000}})}
  catch(e){return {err:e.code}}
}

function makeBox(el,id){

  const form=el.querySelector("form"),inp=el.querySelector("input"),clr=el.querySelector(".clr"),ul=el.querySelector(".sugg");let sel=-1;

const STANDALONE=(()=>{try{return window.top===window}catch(e){return false}})();
function openUrl(u){if(STANDALONE&&!SET.newTab){location.replace(u);return true}try{return !!window.open(u,"_blank","noopener")}catch(e){return false}}
if(STANDALONE)new MutationObserver(()=>{if(!SET.newTab)document.querySelectorAll('#results a[target="_blank"]').forEach(a=>a.removeAttribute("target"))}).observe(document.body,{childList:true,subtree:true});
let runId=0;
async function search(q,lucky=false){
  q=q.trim();if(!q)return;
  if(STANDALONE&&new URLSearchParams(location.search).get("q")!==q&&!address(q)&&!lucky){location.href="?q="+encodeURIComponent(q);return}
  const id=++runId;
  hInput.value=tInput.value=q;
  $("homeview").hidden=true;$("resultsview").hidden=false;window.scrollTo(0,0);
  const addr=address(q),named=siteByName(q),ans=calc(q),loc=local(q);
  const jump=addr||(lucky?(named||loc[0])?.url:named?.url);
  let opened=false;if(jump&&(addr||lucky||(STANDALONE&&named)))opened=openUrl(jump);if(opened&&STANDALONE)return;
  const t0=performance.now();
  const el=$("results");
  const resHtml=(list,ai)=>list.map(r=>`<div class="res"><div class="src"><span class="fav">${esc(host(r.url)[0].toUpperCase())}</span><div><b>${esc(r.site||host(r.url))}${ai?`<span class="tag">Spark AI</span>`:""}</b><cite>${esc(crumb(r.url))}</cite></div></div><a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a><p>${bold(r.snippet||r.desc||"",q)}</p></div>`).join("");
  const enc=encodeURIComponent(q);
  const more=[
    {title:`${q} – Wikipedia`,url:`https://en.wikipedia.org/w/index.php?search=${enc}`,desc:`Look up "${q}" in the free encyclopedia.`},
    {title:`${q} – YouTube`,url:`https://www.youtube.com/results?search_query=${enc}`,desc:`Watch videos about "${q}".`},
    {title:`Meaning of "${q}" – Merriam-Webster`,url:`https://www.merriam-webster.com/dictionary/${enc}`,desc:`Definition, pronunciation and examples of "${q}".`},
    {title:`${q} – Reddit`,url:`https://www.reddit.com/search/?q=${enc}`,desc:`See what people are saying about "${q}".`},
    {title:`${q} – Images on Unsplash`,url:`https://unsplash.com/s/photos/${enc}`,desc:`Free photos of "${q}".`},
    {title:`${q} – Amazon`,url:`https://www.amazon.com/s?k=${enc}`,desc:`Shop for "${q}".`},
  ];
  const greet=/^(hi+|hello+|hey+|hiya|yo|sup|howdy|hola|good (morning|afternoon|evening)|what'?s up)[!. ]*$/i.test(q);
  const draw=(ov,ai)=>{
    const all=[...(jump?[{title:named&&!addr?named.title:bare(jump),url:jump,desc:opened?"Opened in a new tab.":addr?"Go to this address.":named.desc}]:[]),...loc.filter(s=>s.url!==jump),...(ai||[]).filter(r=>r&&/^https?:\/\//.test(r.url)&&r.url!==jump&&!loc.some(s=>host(s.url)===host(r.url)))];
    const extra=addr?[]:more.filter(m=>!all.some(r=>host(r.url)===host(m.url)));
    all.push(...extra);
    el.innerHTML=`<div class="stats">About ${all.length} results (${((performance.now()-t0)/1000).toFixed(2)} seconds)</div>`+
      (ans!==null?`<div class="answer"><small>${esc(q)} =</small>${ans.toLocaleString()}</div>`:"")+
      (greet?`<div class="answer"><small>SolarSpark says</small>Hey there! What do you want to find today?</div>`:"")+
      (ov||"")+all.map(r=>resHtml([r],!!ai&&ai.includes(r))).join("")+
      "";
    if(jump&&!opened&&(addr||lucky)){const a=el.querySelector(".res a.t");a&&a.focus()}
  };
  if(addr||ans!==null){draw("");return}
  if(!window.claude){draw("");return}
  draw(`<div class="overview"><h3><i></i>Spark Overview</h3><p class="thinking">Searching…</p></div>`);
  const r=await askSpark(q);if(id!==runId)return;
  let ov="";
  if(r.off)ov="";
  else if(r.err==="not_granted"||r.err==="sampling_disabled")ov=`<div class="overview"><h3><i></i>Spark Overview</h3><p class="note">Spark answers are turned off. Results below come from the SolarSpark index.</p></div>`;
  else if(r.err&&r.err!=="cancelled")ov=`<div class="overview"><h3><i></i>Spark Overview</h3><p class="note">${r.err==="rate_limited"?"Too many searches at once. Wait a moment and search again.":"Couldn't get an answer this time. Search again to retry."}</p></div>`;
  else if(r.overview)ov=`<div class="overview"><h3><i></i>Spark Overview</h3><p>${esc(r.overview)}</p><span class="note">AI-generated answer. Check important facts at the sources.</span></div>`;
  draw(ov,Array.isArray(r.results)?r.results.map(x=>({title:String(x.title||""),url:String(x.url||""),snippet:String(x.snippet||"")})).filter(x=>x.title):null);
}

(function(){const c=document.getElementById("sky"),x=c.getContext("2d");let W,H,stars=[];
